<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タルコフ クエストマップ — 引っ越しました / Moved</title>
<link rel="canonical" href="https://tarkovquestmap.github.io/">
<meta name="robots" content="noindex">
<script>
/* 新しいURLへ転送する。共有リンク(#s=…)はそのまま渡し、それ以外は保存データ(完了・レベルなど)を #mig= で引き継ぐ */
(function(){
  var NEW = "https://tarkovquestmap.github.io/", h = location.hash || "";
  try{
    if(!/^#s=/.test(h)){
      var o = {};
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(/^eft_qm_/.test(k) && !/^eft_qm_cache_/.test(k)) o[k] = localStorage.getItem(k);
      }
      if(Object.keys(o).length){
        var enc = btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        if(enc.length < 400000) h = "#mig=" + enc;
      }
    }
  }catch(e){}
  location.replace(NEW + h);
})();
</script>
<meta http-equiv="refresh" content="3; url=https://tarkovquestmap.github.io/">
<style>body{background:#1b1b1b;color:#d8d4cc;font-family:"Segoe UI","Noto Sans JP",sans-serif;padding:40px 20px;text-align:center;line-height:1.8}a{color:#c7b083}</style>
</head>
<body>
<h2>タルコフ クエストマップは引っ越しました</h2>
<p>新しいアドレス: <a href="https://tarkovquestmap.github.io/">https://tarkovquestmap.github.io/</a></p>
<p>自動で移動します。移動しない場合は上のリンクを押してください。</p>
<p style="color:#9a948a">Tarkov Quest Map has moved to a new address. You will be redirected automatically.</p>
</body>
</html>
